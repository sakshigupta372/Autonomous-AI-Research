[project]
name = "research-agent"
version = "0.3.0"
description = "Autonomous AI Research Scientist: multi-agent arXiv reader, GraphRAG, comparison, reflection, reproduction, and autonomous research loop."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "arxiv>=2.1.0",
    "requests>=2.31.0",
    "pymupdf>=1.24.0",
    "chromadb>=0.5.0",
    "networkx>=3.3",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
research-agent = "research_agent.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
